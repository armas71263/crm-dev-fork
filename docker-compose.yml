version: "3.8"
name: rubbertrack-platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports: ["5432:5432"]
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: rubbertrack}
    volumes: [pgdata:/var/lib/postgresql/data]

  directus:
    image: directus/directus:latest
    ports: ["8055:8055"]
    # Env-driven: with DIRECTUS_DB_* set in .env (Supabase pooler + the
    # dedicated directus_admin role from migration 006) the control plane runs
    # against the live project; unset, it falls back to the local dev stack.
    environment:
      KEY: ${DIRECTUS_KEY:-k}
      SECRET: ${DIRECTUS_SECRET:-s}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin1234}
      DB_CLIENT: pg
      DB_HOST: ${DIRECTUS_DB_HOST:-postgres}
      DB_PORT: ${DIRECTUS_DB_PORT:-5432}
      DB_DATABASE: ${DIRECTUS_DB_DATABASE:-rubbertrack}
      DB_USER: ${DIRECTUS_DB_USER:-directus_admin}
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directusdev}
      DB_SSL: ${DIRECTUS_DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DIRECTUS_DB_SSL_REJECT_UNAUTHORIZED:-false}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
    depends_on: [postgres]

  bff:
    build: {context: ./apps/bff}
    ports: ["4000:4000"]
    environment: {BFF_PORT: "4000", DIRECTUS_URL: http://directus:8055, AI_SERVICE_URL: http://ai-service:5000, PG_HOST: postgres, PG_DATABASE: rubbertrack, PG_USER: app_role, PG_PASSWORD: apppass, PG_ADMIN_USER: postgres, PG_ADMIN_PASSWORD: postgres}
    volumes: [./preview:/app/preview:ro]
    depends_on: [directus, ai-service]

  ai-service:
    build: {context: ./apps/ai}
    ports: ["5000:5000"]
    environment:
      AI_PORT: "5000"
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: "google/gemma-4-26b-a4b-it:free"
      PG_HOST: postgres
      PG_DATABASE: rubbertrack
      PG_USER: app_role
      PG_PASSWORD: apppass
    depends_on: [postgres]

  web:
    build: {context: ./apps/web}
    ports: ["3000:3000"]
    environment: {NEXT_PUBLIC_BFF_URL: http://localhost:4000, NEXT_PUBLIC_DIRECTUS_URL: http://localhost:8055}
    depends_on: [bff]

volumes:
  pgdata:
