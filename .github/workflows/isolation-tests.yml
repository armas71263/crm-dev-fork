name: isolation-tests
on:
  pull_request:
    branches: [main, feat/*]
  push:
    branches: [main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install service dependencies
        run: |
          npm --prefix apps/bff ci
          npm --prefix apps/ai ci
      - name: Run BFF + AI unit tests
        run: |
          npm --prefix apps/bff test
          npm --prefix apps/ai test
  rls-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot Postgres
        run: docker compose up -d --wait postgres
      - name: Wait for Postgres readiness
        run: |
          for i in $(seq 1 30); do
            docker exec rubbertrack-platform-postgres-1 pg_isready -U postgres && break
            sleep 1
          done
      - name: Apply migrations (schema, roles, demo seeds)
        run: ./infra/scripts/migrate.sh
      - name: Run isolation suite (staff, customer, readonly)
        run: bash tests/run-isolation.sh
      - name: Teardown
        if: always()
        run: docker compose down -v
